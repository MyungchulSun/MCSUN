<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <div class="top-controls">
        <button id="theme-toggle">Toggle Theme</button>
    </div>
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <div class="lotto-numbers" id="lotto-numbers"></div>
        <button id="generate">Generate New Numbers</button>

        <section class="inquiry-section">
            <h2>Partnership Inquiry</h2>
            <form class="inquiry-form" action="https://formspree.io/f/meelkekv" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="text" name="company" placeholder="Company Name">
                <textarea name="message" rows="4" placeholder="Tell us about your partnership idea" required></textarea>
                <button type="submit">Send Inquiry</button>
            </form>
            <p class="form-note">Partnership inquiries are sent securely via Formspree.</p>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
